# 该文件用于: 管理整个项目的配置.

# MySQL 配置
[mysql]
host = localhost
user = root
password = 123456
database = med_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password = 1234
db = 0

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = medrag
collection_name = medrag_collection


# LLM 配置
[llm]
model = qwen-plus
# 【安全】API 密钥已移至项目根目录 .env 文件（变量名: DASHSCOPE_API_KEY），
# base/config.py 会自动加载 .env，环境变量优先级高于本文件。
# 请勿在此明文保存 key。
# 注意：本次报 404 Not support 的原因是这里指向了 Anthropic 协议端点，
# 而代码用的是 OpenAI 协议（/chat/completions）。同一台主机上的 OpenAI 兼容路径是
# compatible-mode/v1，改回即可（key 与模型名都不用换）。
dashscope_base_url = https://ws-r2dfzddjizmywvl8.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 应用配置
[app]
# 有效科室列表（与 mysql_qa/data/医疗导诊FAQ.csv 的科室字段对齐，可按需扩充）
departments = ["心血管内科", "呼吸内科", "全科医学"]
customer_service_phone = 12345678