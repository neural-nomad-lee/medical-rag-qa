# 该文件用于: 管理整个项目的配置.

# MySQL 配置
[mysql]
host = localhost
user = root
password = 123456
database = med_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password = 1234
db = 0

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = medrag
collection_name = medrag_collection


# LLM 配置
[llm]
model = qwen-plus
# 【安全】API 密钥已移至项目根目录 .env 文件（变量名: DASHSCOPE_API_KEY），
# base/config.py 会自动加载 .env，环境变量优先级高于本文件。
# 请勿在此明文保存 key。
